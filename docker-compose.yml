services:
  db:
    image: postgis/postgis:16-3.4
    container_name: facylitech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facylitech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facylitech}
      POSTGRES_DB: ${POSTGRES_DB:-facylitech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facylitech} -d ${POSTGRES_DB:-facylitech}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
